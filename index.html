<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Homepage</title>
    
    <!-- Link your dedicated style file here -->
    <link rel="stylesheet" href="index-style.css">
</head>
<body>

    <!-- Personal Header Section -->
<header class="portfolio-header">
    <div class="profile-avatar-wrapper">
        <img src="Photos/Personal/AbuMusa.jpg" alt="Profile Picture" class="profile-avatar">
    </div>
    <div class="profile-info">
        <h1 class="profile-name">Abu Musa</h1>
        <p class="profile-title">Electrical & Electronics Engineer | Hardware & IoT Specialist</p>
        <p class="profile-bio">
            Specializing in PCB design, embedded systems prototyping, and custom mechanical solutions.
        </p>
    </div>
</header>

    
    
    <!-- Category Tabs -->
    <div class="category-tabs">
        <button class="tab-btn active" onclick="loadSlider('projects-slider.html', this)">Projects</button>
        <button class="tab-btn" onclick="loadSlider('experience-slider.html', this)">Experience</button>
        <button class="tab-btn" onclick="loadSlider('others-slider.html', this)">Others / DIY</button>
    </div>

    <!-- Container where the dynamic HTML slider files load -->
    <div id="slider-content-area"></div>

    <script>
        let currentSlide = 0;

        function loadSlider(filePath, btn) {
            if (btn) {
                document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
            }

            fetch(filePath)
                .then(response => {
                    if (!response.ok) throw new Error("Could not load slide file.");
                    return response.text();
                })
                .then(htmlContent => {
                    document.getElementById('slider-content-area').innerHTML = htmlContent;
                    initSlider();
                })
                .catch(err => console.error("Error loading slider:", err));
        }

        function initSlider() {
            currentSlide = 0;
            const slides = document.querySelectorAll(".project-card-slide");
            const dotsContainer = document.getElementById("dotsContainer");

            if (!dotsContainer || slides.length === 0) return;

            dotsContainer.innerHTML = "";
            slides.forEach((_, idx) => {
                const dot = document.createElement("span");
                dot.classList.add("dot");
                if (idx === 0) dot.classList.add("active");
                dot.onclick = () => goToSlide(idx);
                dotsContainer.appendChild(dot);
            });

            updateSlider();
        }

        function updateSlider() {
            const slidesTrack = document.getElementById("slidesTrack");
            const dots = document.querySelectorAll(".dot");
            
            if (!slidesTrack) return;

            slidesTrack.style.transform = `translateX(-${currentSlide * 100}%)`;
            dots.forEach((dot, idx) => {
                dot.classList.toggle("active", idx === currentSlide);
            });
        }

        function moveSlide(step) {
            const slides = document.querySelectorAll(".project-card-slide");
            if (slides.length === 0) return;
            currentSlide = (currentSlide + step + slides.length) % slides.length;
            updateSlider();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSlider();
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadSlider('projects-slider.html', document.querySelector('.tab-btn.active'));
        });
    </script>
</body>
</html>
